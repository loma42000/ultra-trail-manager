<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a161d;--bg2:#0d1d26;--card:#11242f;--card2:#152b37;--line:#1f3a47;--line2:#2a4a59;--txt:#e6f0f3;--mut:#89a6b2;--acc:#1fa89a;--acc2:#4cc9b8;--acc3:#3b8fd4;--ok:#45c08a;--warn:#e7b94a;--bad:#e2605e;--blue:#3b8fd4;--tint:#123a3d;}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0b1a23 0,#0a161d 420px) fixed;color:var(--txt);font:14px/1.5 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3,.cond{font-family:Inter,system-ui,sans-serif;margin:0}
h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.card>.row:first-child:has(h2){border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.row h2{border-bottom:none;padding-bottom:0;margin-bottom:0}
h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-bottom:8px}
.mbox>.row h2,.mbox h2{border-bottom:none;padding-bottom:0;font-size:15px}
button{border-radius:6px;font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line2);background:var(--card2);color:var(--txt);padding:7px 14px;transition:background .12s,border-color .12s}
button:hover{border-color:var(--acc);background:#183441}
button.pri{background:linear-gradient(90deg,var(--acc),#2a9cc0);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover{background:var(--acc2);border-color:var(--acc2)}
button.sm{padding:4px 10px;font-size:12px}
button:disabled{opacity:.35;cursor:not-allowed}
input,select,textarea{border-radius:6px;font:inherit;font-size:13px;background:var(--bg);color:var(--txt);border:1px solid var(--line2);padding:6px 8px}
input:focus,select:focus{outline:none;border-color:var(--acc)}
input[type=number]{width:64px}
input[type=range]{accent-color:var(--acc)}
.wrap{max-width:1560px;margin:0 auto;padding:0 20px 90px}
/* en-tête */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#0c2230,#0d2a2c);border-bottom:1px solid var(--line)}
.topin{max-width:1560px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:150px 1fr 110px;align-items:stretch;border-bottom:1px solid var(--line)}
.statbar{border-right:1px solid var(--line)}
.brand{display:flex;flex-direction:column;justify-content:center;font-weight:800;font-size:13px;letter-spacing:.14em;color:var(--txt);line-height:1.15}
.brand span{color:var(--acc2)}
.statbar{display:grid;grid-template-columns:repeat(8,1fr)}
.sc{padding:10px 14px;border-left:1px solid var(--line);min-width:0}
.sc label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc small{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menucell{display:flex;align-items:center;justify-content:flex-end}
.strip{padding:7px 20px;font-size:12px;text-align:center;border-bottom:1px solid #4a2a2c;background:#241718;color:#f3b0b0}
nav{max-width:1560px;margin:0 auto;padding:0 20px;display:grid;overflow:auto;gap:6px}
nav button{border:1px solid transparent;border-radius:8px;background:none;padding:10px 12px;color:var(--mut);white-space:nowrap;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.07em}
nav.groups{padding-top:10px;padding-bottom:10px;overflow:visible}
.ng{position:relative}.ng>button{width:100%;display:flex;align-items:center;justify-content:center;gap:4px}
.ng .cur{text-transform:none;letter-spacing:0;font-weight:500;opacity:.85}
.ng .caret{margin-left:6px;font-size:11px;opacity:.8;transition:transform .15s}.ng.open .caret{transform:rotate(180deg)}
.ng .dd{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:6px;box-shadow:0 12px 30px #0009}
.ng.open .dd{display:grid;gap:4px;animation:tipin .12s ease-out}
.ng .dd button{text-transform:none;letter-spacing:0;font-weight:500;font-size:13px;text-align:left;padding:8px 12px;border-color:transparent;background:none}
.ng .dd button:hover{background:var(--card2)}.ng .dd button.on{background:var(--tint);border-color:var(--acc);color:var(--txt)}
nav button:hover{background:var(--card);color:var(--txt)}
nav.groups button{background:var(--card);border-color:var(--line)}nav.groups button.on{background:linear-gradient(90deg,var(--acc),#2a8fbf);border-color:var(--acc);color:#fff}

nav.sub button{font-weight:500;text-transform:none;letter-spacing:0;font-size:13px;padding:7px 12px}
nav.sub button.on{color:var(--txt);background:var(--card2);border-color:var(--line2)}
/* grilles */
.grid{display:grid;gap:16px;align-items:start}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:980px){.g2,.g3{grid-template-columns:1fr}.statbar{grid-template-columns:repeat(4,1fr)}.topin{grid-template-columns:1fr}.brand{padding:8px 0;border-right:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card .card{background:var(--card2)}
.mut{color:var(--mut)}.small{font-size:12px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.bar{border-radius:4px;height:6px;background:#081218;overflow:hidden;position:relative;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.bar .pot{position:absolute;top:-1px;width:2px;height:8px;background:#fff9}
.tip{border-radius:8px;background:#11303a;border:1px solid var(--line);border-left:3px solid var(--acc2);padding:10px 14px;margin-bottom:10px}
.tip b{color:var(--acc2)}
.alert{border-radius:8px;background:#221819;border:1px solid #4a2a2c;border-left:3px solid var(--bad);padding:10px 14px;margin-bottom:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
th{color:#9cc3cf;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;background:#173444}
tr:nth-child(even) td{background:#ffffff04}
tr:last-child td{border-bottom:none}
th:first-child{border-top-left-radius:6px}th:last-child{border-top-right-radius:6px}
.badge{border-radius:4px;display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;background:var(--card2);border:1px solid var(--line2);color:var(--mut);margin-left:4px;vertical-align:middle}
.b-major{color:#f0b35a;border-color:#1f5a55}.b-final{color:#ff9b8a;border-color:#5a2a26}.b-new{color:var(--ok);border-color:#24503a}.b-est{color:#9fb3c8}
.pill{border-radius:6px;display:inline-block;background:var(--card2);border:1px solid var(--line2);padding:4px 10px;font-size:12px;white-space:nowrap}
.pill b{color:var(--acc2)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips:has(>:nth-child(2):last-child){grid-template-columns:repeat(2,1fr)}
.chips:has(>:nth-child(3):last-child),.chips:has(>:nth-child(6):last-child){grid-template-columns:repeat(3,1fr)}
.chips:has(>:nth-child(5):last-child){grid-template-columns:repeat(5,1fr)}
.chips:has(>:nth-child(7):last-child){grid-template-columns:repeat(7,1fr)}
@media(max-width:980px){.chips,.chips:has(>*){grid-template-columns:repeat(2,1fr)!important}}
label.f input,label.f select{width:100%}
.stat{grid-template-columns:120px 1fr 90px!important}
.chip{border-radius:8px;border:1px solid var(--line2);padding:10px 12px;background:var(--card2);cursor:pointer}
.chip:hover{border-color:var(--acc)}
.chip.on{border-color:var(--acc);background:#10353a;box-shadow:inset 3px 0 0 var(--acc)}
.chip small{display:block;color:var(--mut);margin-top:2px}
.footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);z-index:6}
.footer .in{max-width:1560px;margin:0 auto;padding:10px 20px;display:flex;gap:10px;align-items:center;justify-content:space-between}

function gauss(){return Math.sqrt(-2*Math.log(R()||1e-9))*Math.cos(2*Math.PI*R());}
function genStaff(role){
 const tot=NATS.reduce((a,n)=>a+n[3],0);let r=R()*tot,N=NATS[0];for(const n of NATS){if((r-=n[3])<0){N=n;break;}}
 const sex=R()<.5?'H':'F';const first=pick(sex==='H'?N[4]:N[5]),last=pick(N[6]);
 const nat=[...N[2]];if(nat.length>1&&R()<.5)nat.reverse();
 const langs={[nat[0]]:100};if(nat[1])langs[nat[1]]=rint(55,95);
 if(!langs.en&&R()<.62)langs.en=rint(25,90);
 if(R()<.28){const l=pick(Object.keys(LANGS).filter(x=>!langs[x]));langs[l]=rint(15,70);}
 const age=rint(24,64);const avg=clamp(50+gauss()*16+(age-30)*.25,15,96);
 const stats={};for(const k in ROLE_STATS[role])stats[k]=Math.round(clamp(avg+rnd(-12,12),10,99));
 const common=genCommon(age);const a=.75*Object.values(stats).reduce((x,y)=>x+y,0)/Object.keys(stats).length+.25*Object.values(common).reduce((x,y)=>x+y,0)/5;
 return{id:Math.random().toString(36).slice(2,9),role,sex,first,last,age,nat:N[0],flag:N[1],main:nat[0],langs,stats,common,
  salary:Math.round((20+a*a/25)/5)*5,minRep:Math.round(Math.max(0,a-55)*1.5),rel:0,weeks:0};
}
function refreshMarket(){S.market={};for(const k in STAFF_ROLES)S.market[k]=Array.from({length:4},()=>genStaff(k));S.marketWeek=S.season*52+S.week;}
function avgStat(m){const v=Object.values(m.stats);return v.reduce((a,b)=>a+b,0)/v.length;}
function playerMain(){const L=S.runner.langs;return Object.keys(L).find(k=>L[k]>=100)||'fr';}
function comm(m){let best=0,lang=null;for(const l in m.langs){const v=Math.min(m.langs[l],S.runner.langs[l]||0);if(v>best){best=v;lang=l;}}return{v:best,lang};}
function effOf(m){return(.35+.65*comm(m).v/100)*(.75+.25*m.rel/100)*(.85+m.common.exp*.003);}
function SL(role,stat){const m=S.team&&S.team[role];if(!m||m.absent)return 0;const v=stat?m.stats[stat]:avgStat(m);return v/100*3.3*effOf(m);}
function SN(role){const m=S.team&&S.team[role];return m?m.first+' '+m.last:'';}
function teamCost(){return Object.values(S.team||{}).filter(Boolean).reduce((a,m)=>a+m.salary,0);}
function learn(cur){return Math.min(100,(cur||0)+1.8*(1-(cur||0)/110));}
function teamWeek(){
 for(const role in S.team){const m=S.team[role];if(!m)continue;m.weeks++;m.absent=false;
  if(m.common.fiab<60&&R()<(60-m.common.fiab)/350){m.absent=true;log(`🚫 ${m.first} ${m.last} (${STAFF_ROLES[role].n.toLowerCase()}) est indisponible cette semaine.`);mail(`${STAFF_ROLES[role].i} ${m.first} ${m.last}`,'Indisponible cette semaine',`Désolé ${S.runner.first}, je ne pourrai pas être là cette semaine. On se rattrape la semaine prochaine !`,{tab:'staff',lbl:'Voir mon staff'});}
  if(m.weeks>20&&R()<Math.max(0,60-m.common.loyal)/600){
   if(m.rel<45){log(`💔 ${m.first} ${m.last} a été débauché(e) par un autre athlète et quitte ton staff.`,'big');mail(`${STAFF_ROLES[role].i} ${m.first} ${m.last}`,'Je quitte ton staff',`${S.runner.first}, j'ai reçu une offre d'un autre athlète que je ne peux pas refuser. Merci pour ces mois ensemble et bonne continuation.`,{tab:'staff',lbl:'Recruter un remplaçant'});S.team[role]=null;continue;}
   m.salary=Math.round(m.salary*1.15/5)*5;m.rel=Math.max(0,m.rel-5);log(`💸 ${m.first} ${m.last} a obtenu une augmentation : ${money(m.salary)}/sem.`);mail(`${STAFF_ROLES[role].i} ${m.first} ${m.last}`,'Demande d\'augmentation',`Salut ${S.runner.first}, vu le travail fourni, j'ai demandé une revalorisation : mon salaire passe à <b>${money(m.salary)}/semaine</b>.`,{tab:'staff',lbl:'Voir mon staff'});}
  const c=comm(m);const slow=c.v>=70?.5:1;
  // le coureur apprend la langue du staff, le staff apprend celle du coureur
  const pl=m.main,me=playerMain();
  if(pl!==me&&(S.runner.langs[pl]||0)<99){const b=S.runner.langs[pl]||0,a=b+(learn(b)-b)*slow*(.7+m.common.peda/170);S.runner.langs[pl]=a;
   for(const th of [8,30,60,85])if(b<th&&a>=th)log(`🗣️ Grâce à ${m.first}, ton niveau en ${LANGS[pl].toLowerCase()} passe à « ${langLvl(a)} ».`,th>=60?'big':'');}
  if((m.langs[me]||0)<99){const b=m.langs[me]||0,a=b+(learn(b)-b)*slow*(.6+m.common.adapt/125);m.langs[me]=a;
   for(const th of [30,60,85])if(b<th&&a>=th)log(`🗣️ ${m.first} ${m.last} progresse en ${LANGS[me].toLowerCase()} : niveau « ${langLvl(a)} ».`);}
  const c2=comm(m);m.rel=clamp(m.rel+.3+(c2.v-45)/80+(m.common.peda-50)/120+rnd(-.5,.5),0,100);
  if(c2.v<35&&R()<.08){m.rel=Math.max(0,m.rel-4);log(`😕 Malentendu avec ${m.first} (${STAFF_ROLES[role].n}) à cause de la barrière de la langue.`);}
  if(m.weeks===52)log(`🎂 Un an de collaboration avec ${m.first} ${m.last}.`);
 }
}
function hireStaff(role,id){
 const m=S.market[role].find(x=>x.id===id);if(!m)return;
 if(S.rep<minRepFor(m))return toast(`${m.first} ${m.last} ne travaille qu'avec des coureurs de réputation ≥ ${minRepFor(m)}.`);
 if(S.money<m.salary*2)return toast('Il faut au moins 2 semaines de salaire en caisse.');
 if(S.team[role])log(`${SN(role)} quitte ton staff.`);
 m.rel=Math.round(30+comm(m).v*.3);S.team[role]=m;S.market[role]=S.market[role].filter(x=>x.id!==id);
 log(`👥 ${m.first} ${m.last} (${m.flag} ${m.nat}) rejoint ton staff comme ${STAFF_ROLES[role].n.toLowerCase()}.`,'big');save();render();
}
function fireStaff(role){const m=S.team[role];if(!m)return;S.money-=m.salary;log(`${m.first} ${m.last} quitte ton staff (1 semaine d'indemnité).`);S.team[role]=null;save();render();}
function newCandidates(){if(S.money<100)return toast('Il faut 100 € pour publier une annonce.');S.money-=100;refreshMarket();log('📣 Nouvelle annonce de recrutement publiée.');save();render();}

function firstMonday(y){const d=new Date(y,0,1);while(d.getDay()!==1)d.setDate(d.getDate()+1);return d;}

function weekLabel(w,season){const d=firstMonday(season||S.season);d.setDate(d.getDate()+w*7);return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,4)+'.';}

// ---------- calcul charge / forme / risques ----------
function planLoad(plan){let l=plan.hours*8;for(const k in plan.s)l+=(SESS[k]?.load||0)*plan.s[k];return Math.max(0,l);}
function formOf(ctl,atl){return clamp(50+(ctl-atl)*0.6,0,100);}
function formLabel(f){return f>=70?['Excellente','ok']:f>=55?['Bonne','ok']:f>=40?['Correcte','']:f>=25?['Fatigué','warn']:['Épuisé','bad'];}
function atlDecay(){return 1.5-S.stats.rec*0.004-SL('kine','recup')*0.05;}
function projectLoad(load){const ctl=S.ctl+(load-S.ctl)/6;const atl=S.atl+(load-S.atl)/atlDecay();return{ctl,atl};}
function injuryRisk(plan){
 if(S.injury)return 0;
 const p=projectLoad(planLoad(plan));const acwr=p.atl/Math.max(p.ctl,15);
 let r=1.2+Math.max(0,acwr-1.15)*30+(plan.s.desc||0)*.7+(plan.s.vma||0)*.4-(plan.s.renfo||0)*.5-(plan.s.recup||0)*.3
  -S.stats.res*.025-SL('kine','prev')*1-SL('physio','prev')*.7+(S.runner.age>38?1:0)+Math.max(0,plan.hours-S.prevHours*1.25)*.4;
 if(hasTal('solide'))r*=.65;
 return clamp(r,.3,45);
}
function illnessRisk(plan){
 if(S.ill)return 0;
 const p=projectLoad(planLoad(plan));
 const m=new Date(firstMonday(S.season).getTime()+S.week*7*864e5).getMonth();
 let r=.6+Math.max(0,p.atl-p.ctl)*.06+([10,11,0,1].includes(m)?1:0)+(S.week-S.lastRaceWeek<=1?2:0)-SL('nutri','sante')*.5-S.stats.rec*.01;
 if(hasTal('immun'))r*=.5;
 return clamp(r,.3,30);
}

function fansRep(){return Math.min(20,(S.fans||0)/2500);}
function genMediaOffer(){
 const pool=MEDIA.filter(m=>S.rep+fansRep()>=m.min&&!S.mediaOffers.some(o=>o.n===m.n));if(!pool.length)return;
 const w=pool.map(m=>m.small?2:1+m.min/40);let r=R()*w.reduce((a,b)=>a+b,0),m=pool[0];for(let i=0;i<pool.length;i++){if((r-=w[i])<0){m=pool[i];break;}}
 const wk=S.week+rint(1,2),d=rint(0,6);const fans=rint(m.fans[0],m.fans[1]);
 const o={id:Math.random().toString(36).slice(2,8),n:m.n,t:m.t,fmt:pick(m.f),fans,pay:m.pay,abs:S.season*52+wk,season:S.season,w:wk,d,exp:2,small:m.small};
 S.mediaOffers.push(o);
 mail(`${MEDIA_ICON[m.t]} ${m.n}`,`Demande ${m.t==='TV'?'TV':'média'} : ${o.fmt}`,`Bonjour ${S.runner.first},<br><br>${m.small?'Je suis un petit créateur de contenu trail et j\'adorerais':'Notre rédaction aimerait'} te proposer : <b>${o.fmt}</b>, le ${DAYS[d]} ${dayDate(S.season,wk,d).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}.<br>Audience estimée : <b>+${fansTxt(fans)} fans</b>${o.pay?`, cachet ${money(o.pay)}`:''}.<br><br>Réponds-nous vite (2 semaines max) !`,{tab:'agenda',lbl:'Voir l\'agenda et répondre'});
}
function acceptMedia(id){const i=S.mediaOffers.findIndex(o=>o.id===id);if(i<0)return;const o=S.mediaOffers.splice(i,1)[0];if(o.w<S.week){toast('Trop tard !');return render();}S.media.push(o);log(`🎬 Tu as accepté : ${o.fmt} (${o.n}).`);save();render();}
function declineMedia(id){S.mediaOffers=S.mediaOffers.filter(o=>o.id!==id);save();render();}
function mediaWeek(){
 for(const o of S.media.filter(x=>x.season===S.season&&x.w===S.week&&!x.done)){o.done=true;
  const mult=1+Math.min(.5,S.rep/200);const g=Math.round(o.fans*mult);S.fans=(S.fans||0)+g;S.money+=o.pay;S.atl+=o.small?4:3;S.rep=Math.min(100,S.rep+(o.t==='TV'?.8:.25));
  log(`🎬 ${o.fmt} avec ${o.n} : +${fansTxt(g)} fans${o.pay?', +'+money(o.pay):''}.`);}
 S.mediaOffers.forEach(o=>o.exp--);S.mediaOffers=S.mediaOffers.filter(o=>o.exp>0&&o.w>=S.week+1);
 if(R()<.22+S.rep/250+fansRep()/60)genMediaOffer();
}

let AG=null;
function planDays(plan,inj,ill){
 const d=Array.from({length:7},()=>[]);
 if(inj){for(let i=0;i<7;i++)d[i].push(['🩹','Blessé — soins / repos']);return d;}
 if(ill){for(let i=0;i<7;i++)d[i].push(['🤒','Malade — repos']);return d;}
 const list=[];for(const k in plan.s)for(let i=0;i<plan.s[k];i++)list.push(k);
 const pref={long:[6,5],seuil:[1,3],vma:[1,3],cotes:[3,1,5],bat:[5,6],desc:[3,5],tech:[4,2],renfo:[0,2,4],nuit:[4,2],nutri:[6,5],mental:[0,2,4],recup:[0,4]};
 for(const k of list){const order=[...(pref[k]||[2,4]),0,1,2,3,4,5,6];const day=order.find(x=>d[x].length<(SESS[k].load<=8?2:1)&&!(SESS[k].load>8&&d[x].some(y=>y[2])))??order[0];d[day].push([SESS[k].i,SESS[k].n,SESS[k].load>8]);}
 const keyH=list.filter(k=>SESS[k].load>8).length*1.2;let rest=Math.max(0,plan.hours-keyH);
 const free=[0,1,2,3,4,5,6].filter(i=>!d[i].some(y=>y[2]));const rd=plan.hours<10?0:-1;
 const easy=free.filter(i=>i!==rd);const per=easy.length?rest/easy.length:0;
 if(per>=.4)easy.forEach(i=>d[i].push(['👟',`Footing ${fmtT(per).replace('h00','h')}`]));
 if(rd===0&&!d[0].length)d[0].push(['😴','Repos']);
 return d;
}

 const fm=firstMonday(AG.y);
 const cells=[];for(let i=0;i<off;i++)cells.push(null);for(let i=1;i<=nd;i++)cells.push(new Date(AG.y,AG.m,i));
 const today=dayDate(S.season,S.week,0);
 const cell=dt=>{if(!dt)return'<div></div>';
  const wAbs=Math.floor(Math.round((dt-fm)/864e5)/7),di=(dt.getDay()+6)%7;const season=AG.y;const items=[];
  const evs=EVENTS.filter(e=>e.m-1===dt.getMonth()&&e.d===dt.getDate());const mine=new Set();const sn=e=>esc(e.name.replace(/ by UTMB|HOKA |®/g,'').replace(/ —.*$/,''));
  for(const r of S.results.filter(r=>r.season===season)){const e=EVMAP[r.e];if(!evs.includes(e))continue;mine.add(e.id);items.push(['',`<span class="click" onclick="openRace('${e.id}',${season})">${r.dns?'🚫':r.dnf?'❌':'✅'} <b>${sn(e)}</b> · ${esc(getF(r.e,r.c).name)}<br>${resTxt(r)}</span>`,r.dns||r.dnf?4:1]);}
  if(season===S.season)for(const r of S.regs.filter(r=>!r.done)){const e=EVMAP[r.e];if(!evs.includes(e))continue;mine.add(e.id);items.push(['',`<span class="click" onclick="openRace('${e.id}',${season})">🏁 <b>${sn(e)}</b> · ${esc(getF(r.e,r.c).name)}</span>`,1]);}
  const others=evs.filter(e=>!mine.has(e.id));others.slice(0,2).forEach(e=>items.push(['',`<span class="click mut" onclick="openRace('${e.id}',${season})">📍 ${sn(e)}</span>`,5]));
  if(others.length>2)items.push(['',`<span class="mut" data-tip="${esc(others.slice(2).map(e=>e.name).join('<br>'))}">+${others.length-2} autre(s)</span>`,5]);
  for(const o of (S.media||[]).filter(o=>o.season===season&&o.w===wAbs&&o.d===di))items.push([MEDIA_ICON[o.t],`${esc(o.n)} — ${esc(o.fmt)}`,2]);
  for(const o of (S.mediaOffers||[]).filter(o=>o.season===season&&o.w===wAbs&&o.d===di))items.push(['❔',`Proposition ${esc(o.n)}`,3]);
  if(season===S.season&&wAbs===S.week)planDays(S.plan,S.injury,S.ill)[di].forEach(x=>items.push(x));
  else if(S.hist&&S.hist[season*52+wAbs]){const h=S.hist[season*52+wAbs];planDays(h.plan,h.inj,h.ill)[di].forEach(x=>items.push(x));}
  const isToday=season===S.season&&wAbs===S.week;const past=dt<today;
  const MAXI=3,more=items.length-MAXI;const shown=more>0?items.slice(0,MAXI-1):items;
  return `<div data-tip="${more>0?esc(items.map(x=>(x[0]?x[0]+' ':'')+x[1]).join('<br>')):''}" style="min-height:0;overflow:hidden;border:1px solid ${isToday?'var(--acc)':'var(--line)'};border-radius:8px;padding:5px;background:${isToday?'var(--tint)':'var(--card2)'};${past?'opacity:.55':''}"><div class="small ${isToday?'warn':'mut'}"><b>${dt.getDate()}</b></div>
   ${shown.map(([i,t,k])=>`<div class="small" style="margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${k===1?'background:#123a3d;border-radius:5px;padding:2px 4px':k===4?'background:#3a1d1d;border-radius:5px;padding:2px 4px':k===2?'background:#13304a;border-radius:5px;padding:2px 4px':''}">${i?i+' ':''}${t}</div>`).join('')}${more>0?`<div class="small mut" style="margin-top:3px">+${more+1} autre(s)…</div>`:''}</div>`;};
 const offers=S.mediaOffers||[];
 const [at,ah]=stabs('ag',[['cal','🗓 Calendrier du mois'],['media','🎬 Médias & fans'+(offers.length?' ('+offers.length+')':'')]]);
 const CALH=`<div class="card"><div class="row sp"><h2 data-tip="Séances de la semaine en cours et des semaines passées, courses 🏁 et rendez-vous médias. La case turquoise = cette semaine. Survole une case chargée pour tout voir.">🗓 Agenda — ${MONTHS[AG.m]} ${AG.y} ℹ️</h2><div class="row"><button class="sm" onclick="AG.m--;if(AG.m<0){AG.m=11;AG.y--;}render()">◀</button><button class="sm" onclick="AG=null;render()">Aujourd'hui</button><button class="sm" onclick="AG.m++;if(AG.m>11){AG.m=0;AG.y++;}render()">▶</button></div></div>
 <div style="display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(${Math.ceil(cells.length/7)},minmax(0,1fr));gap:5px;height:calc(100vh - 385px);min-height:300px">${DAYS.map(d=>`<div class="small mut" style="text-align:center">${d}</div>`).join('')}${cells.map(cell).join('')}</div></div>`;
 const MED=`<div class="grid g2"><div class="card"><h2>🎬 Demandes médias</h2><p class="small mut">Plus ta réputation et tes fans grimpent, plus les grosses chaînes te sollicitent. Les petits youtubeurs rapportent moins de fans mais acceptent tout le monde. Chaque rendez-vous fatigue un peu.</p>
  ${offers.length?offers.slice(0,3).map(o=>`<div class="card" style="background:var(--card2);margin-bottom:8px"><div class="row sp"><b>${MEDIA_ICON[o.t]} ${esc(o.n)}</b><span class="small mut">${o.t}${o.small?' · petit créateur':''}</span></div><div>${esc(o.fmt)} — ${DAYS[o.d]} ${dayDate(o.season,o.w,o.d).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</div><div class="small">+${fansTxt(o.fans)} fans estimés${o.pay?' · '+money(o.pay):''}</div><div class="row" style="margin-top:6px"><button class="pri sm" onclick="acceptMedia('${o.id}')">Accepter</button><button class="sm" onclick="declineMedia('${o.id}')">Refuser</button></div></div>`).join(''):'<p class="mut">Aucune demande pour le moment.</p>'}</div>
 <div class="card"><h2>❤️ Fans : ${fansTxt(S.fans||0)}</h2><p class="small">Tes fans augmentent avec tes résultats et tes passages médias. Ils comptent comme de la réputation en plus pour attirer sponsors et médias (bonus actuel : +${fansRep().toFixed(1)}).</p>
  <h3>Rendez-vous à venir</h3>${(S.media||[]).filter(o=>!o.done).map(o=>`<div class="small">${MEDIA_ICON[o.t]} ${esc(o.n)} — ${esc(o.fmt)} (${DAYS[o.d]} sem. ${o.w+1})</div>`).join('')||'<p class="small mut">Aucun.</p>'}</div></div>`;
 return ah+(at==='media'?MED:CALH);
}

let NAV_T=null,NAV_L=null;
function navOpen(gi){document.querySelectorAll('.ng').forEach(n=>n.classList.toggle('open',n.dataset.g==String(gi)));}
function navClose(){document.querySelectorAll('.ng.open').forEach(n=>n.classList.remove('open'));}
function navToggle(gi,ev){ev.stopPropagation();clearTimeout(NAV_T);const n=document.querySelector(`.ng[data-g="${gi}"]`);if(n&&n.classList.contains('open'))navClose();else navOpen(gi);}
function navGo(k){navClose();TAB=k;render();}
document.addEventListener('mouseover',e=>{const n=e.target.closest&&e.target.closest('.ng');clearTimeout(NAV_L);
 if(n){if(!n.classList.contains('open')){clearTimeout(NAV_T);NAV_T=setTimeout(()=>navOpen(n.dataset.g),500);}}
 else{clearTimeout(NAV_T);NAV_L=setTimeout(navClose,250);}});

const UI={};
function stabs(key,items){if(!UI[key]||!items.some(i=>i[0]===UI[key]))UI[key]=items[0][0];

function pager(key,total,per){const pages=Math.max(1,Math.ceil(total/per));const p=clamp(UI[key]||0,0,pages-1);UI[key]=p;
 return{s:p*per,e:p*per+per,html:pages>1?`<div class="pager"><button class="sm" ${p?'':'disabled'} onclick="UI['${key}']=${p-1};render()">◀</button><span class="small mut">Page ${p+1} / ${pages}</span><button class="sm" ${p<pages-1?'':'disabled'} onclick="UI['${key}']=${p+1};render()">▶</button></div>`:''};}

function brandCats(b){return Object.keys(BRANDS).filter(c=>BRANDS[c].some(x=>x[0]===b));}

 const inf=BRAND_INFO[b];const pts=((S.brandPts||{})[S.season]||{})[b]||{pts:0,w:0,p:0};
 const ranks=cats.map(c=>{const t=brandTable(c);return[c,t.findIndex(x=>x.b===b)+1,t.length];});
 const ath=PROS.filter(p=>Object.values(proSpons(p)).includes(b));
 const mine=S.sponsors.filter(s=>s.brand===b),offs=S.offers.filter(o=>o.brand===b);
 const m=document.getElementById('modal');m.className='modal';
 m.innerHTML=`<div class="mbox" style="max-width:900px"><div class="row sp"><div style="display:flex;align-items:center">${logo('brand',b,b,96)}<div><h2 style="border:none;padding:0;margin:0;font-size:22px;text-transform:none;letter-spacing:0">${esc(b)} <span class="mut small">${'★'.repeat(tier)}</span></h2>
  <div class="mut">${inf?esc(inf.o)+' · ':''}${cats.map(c=>SPONSOR_CATS[c].i+' '+SPONSOR_CATS[c].n).join(' · ')}</div></div></div><button onclick="closeModal()">✕</button></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h2>Dans le trail</h2><p>${inf?esc(inf.h):'Marque présente sur le circuit trail. Pas encore de fiche détaillée.'}</p>
   ${inf&&inf.m.length?`<h3 style="margin-top:12px">Modèles phares</h3><div class="row">${inf.m.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`:''}
   <p class="small mut" style="margin-top:12px">Infos générales données à titre indicatif.</p></div>
  <div><div class="card"><h2>Saison ${S.season}</h2><div class="grid g3"><div><div class="mut small">Points</div><div class="kpi">${Math.round(pts.pts)}</div></div><div><div class="mut small">Victoires</div><div class="kpi">${pts.w}</div></div><div><div class="mut small">Podiums</div><div class="kpi">${pts.p}</div></div></div>
   <p class="small">${ranks.map(([c,r,n])=>`${SPONSOR_CATS[c].n} : <b>${r}e</b>/${n}`).join(' · ')}</p></div>

   <p class="small" style="margin-top:10px">${mine.length?'🤝 <b>Ton sponsor</b> ('+mine.map(s=>SPONSOR_CATS[s.cat].n).join(', ')+')':offs.length?'📨 <b>Offre en attente</b> — <span class="click" onclick="closeModal();TAB=\'spons\';UI.sp=\'offers\';render()">voir l\'offre ›</span>':tier>sponsorTierAllowed()?'<span class="mut">Il te faut plus de réputation pour attirer cette marque.</span>':'<span class="mut">Cette marque peut te contacter.</span>'}</p></div></div></div></div>`;

// ---------- logos : badges générés, ou ta propre image (clic sur un logo) ----------
const LOGO_KEY='utm_logos';let LOGOS={};try{LOGOS=JSON.parse(localStorage.getItem(LOGO_KEY))||{};}catch(e){}
function initials(n){const w=String(n).replace(/by UTMB|HOKA|®|—.*$/g,'').trim().split(/[\s\-–'’+&]+/).filter(x=>x&&!/^(de|du|des|la|le|les|by|d|of|the|el|del|dels)$/i.test(x));if(!w.length)return'?';return(w.length>1?w[0][0]+w[1][0]:w[0].slice(0,2)).toUpperCase();}
const TIER_COL={final:['#5a1f2a','#ffb3a6'],major:['#5a4313','#f6cf7a'],event:['#0f4a4a','#7fe3d3'],classic:['#33245a','#c9b4ff'],local:['#2b3a44','#b9cad3']};
function genBadge(kind,name,size,tier){const ini=initials(name);const fs=Math.round(size*.38);
 if(kind==='brand'){const h=hash(name)%360;return`<span style="display:inline-grid;place-items:center;width:${size}px;height:${size}px;border-radius:7px;background:hsl(${h} 40% 26%);border:1px solid hsl(${h} 40% 38%);color:hsl(${h} 70% 86%);font-weight:800;font-size:${fs}px">${ini}</span>`;}
 const [bg,fg]=TIER_COL[tier]||TIER_COL.event;
 return`<span style="display:inline-grid;place-items:center;width:${size}px;height:${size}px;border-radius:50%;background:${bg};border:2px solid ${fg}55;color:${fg};font-weight:800;font-size:${fs}px;position:relative">${ini}<svg viewBox="0 0 20 8" style="position:absolute;bottom:${Math.round(size*.12)}px;width:${Math.round(size*.55)}px;opacity:.6"><path d="M0 8 L6 2 L9 5 L13 0 L20 8Z" fill="${fg}"/></svg></span>`;}
function logo(kind,id,name,size,tier){const k=kind+':'+id;const src=LOGOS[k];size=size||26;
 const inner=src?`<img src="${src}" alt="" style="width:${size}px;height:${size}px;object-fit:contain;border-radius:${kind==='brand'?7:size/2}px;background:#fff">`:genBadge(kind,name,size,tier);
 return`<span class="logo" data-tip="${esc('<b>'+name+'</b><br>'+(src?'Clique pour changer l\'image (clic droit : retirer)':'Clique pour mettre ta propre image'))}" onclick="event.stopPropagation();pickLogo('${k}')" oncontextmenu="event.preventDefault();event.stopPropagation();delLogo('${k}')">${inner}</span>`;}
function pickLogo(k){const i=document.createElement('input');i.type='file';i.accept='image/*';
 i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),sz=128;c.width=c.height=sz;const x=c.getContext('2d');const sc=Math.min(sz/img.width,sz/img.height);x.drawImage(img,(sz-img.width*sc)/2,(sz-img.height*sc)/2,img.width*sc,img.height*sc);
  LOGOS[k]=c.toDataURL('image/png');try{localStorage.setItem(LOGO_KEY,JSON.stringify(LOGOS));}catch(e){toast('Stockage plein : impossible d\'enregistrer l\'image.');}render();};img.src=r.result;};r.readAsDataURL(f);};i.click();}
function delLogo(k){if(!LOGOS[k])return;delete LOGOS[k];try{localStorage.setItem(LOGO_KEY,JSON.stringify(LOGOS));}catch(e){}render();}
const TABS={race:['🏁','Course'],home:['🏠','Tableau de bord'],train:['🏃','Entraînement'],agenda:['🗓','Agenda'],mail:['📬','Messagerie'],cal:['📅','Calendrier'],index:['📈','UTMB Index'],prep:['🎯','Objectif & prépa'],spons:['🤝','Sponsors'],staff:['👥','Staff'],prof:['🪪','Profil'],log:['📰','Journal']};

 document.getElementById('app').innerHTML=`

function nextRaceText(){const r=S.regs.filter(x=>x.week>=S.week&&!x.done).sort((a,b)=>a.week-b.week)[0];if(!r)return 'Aucune course au programme — va voir le calendrier.';const f=getF(r.e,r.c);return `Prochaine course : <b>${esc(EVMAP[r.e].name)} — ${esc(f.name)}</b> dans ${r.week-S.week} sem.`;}
function raceThisWeek(){const r=S.regs.find(x=>x.week===S.week&&!x.done);return r?{reg:r,ev:EVMAP[r.e],f:getF(r.e,r.c)}:null;}

// ---------- conseils (mode guidé) ----------
function tips(){
 const t=[];const fm=formOf(S.ctl,S.atl);
 if(!S.regs.some(r=>!r.done))t.push(['Calendrier','Inscris-toi à une course dans l\'onglet <b>Calendrier</b>. Commence par un format court (20K / 50K) pour gagner tes premières Running Stones.']);
 else if(!S.goal)t.push(['Objectif','Choisis ta course principale dans <b>Objectif & prépa</b> : le jeu te proposera un plan par phase et des courses de préparation.']);
 const g=goalInfo();
 if(g&&g.wt>0){const ph=phaseOf(g.wt);t.push(['Phase '+ph.n,ph.tip+` (J-${g.wt} sem. avant ${esc(g.f.name)}).`]);}
 if(fm<30)t.push(['Fatigue','Ta forme est basse : allège (moins d\'heures, séance de récup) sinon le risque de blessure explose.']);
 const ir=injuryRisk(S.plan);if(ir>=9)t.push(['Blessure','Risque de blessure élevé ('+pct(ir)+'). Réduis la charge, ajoute du renfo ou un kiné.']);
 const weak=Object.entries(S.stats).sort((a,b)=>a[1]-b[1]).slice(0,2).map(([k])=>STATS[k]);
 t.push(['Points faibles','Tes qualités les plus basses : <b>'+weak.join(', ')+'</b>. Le bouton « Travailler mes faiblesses » dans Entraînement construit la semaine pour toi.']);
 if(S.offers.length)t.push(['Sponsors',`Tu as ${S.offers.length} offre(s) de sponsor en attente.`]);
 if(!Object.values(S.team).some(v=>v)&&S.money>2500)t.push(['Staff','Un nutritionniste te prépare ton plan de ravitaillement de course ; un kiné réduit les blessures.']);
 if(S.money<300)t.push(['Budget','Budget serré : attention aux frais d\'inscription, de déplacement et de staff.']);
 return t.slice(0,5);
}
function tipBox(n){if(!S.guided)return'';return tips().slice(0,n||2).map(([h,x])=>`<div class="tip"><b>💡 ${h}</b> — ${x}</div>`).join('');}

  <div class="card"><h3>Dernières nouvelles</h3><div class="log">${S.log.slice(0,8).map(l=>`<div>${l.type==='big'?'⭐ ':''}<span class="mut small">S${l.w+1}</span> ${l.txt}</div>`).join('')}</div></div>
 </div></div>`;
}

// ---------- vue entraînement ----------
function vTrain(){
 const p=S.plan,load=planLoad(p),proj=projectLoad(load),ir=injuryRisk(p),il=illnessRisk(p);
 const nSess=Object.values(p.s).reduce((a,b)=>a+b,0);
 const gains=previewGains(p);
 return `<div class="grid" style="grid-template-columns:3fr 2fr"><div>
 <div class="card"><h2>Plan de la semaine</h2>
  ${S.injury?`<div class="alert">🩹 Blessé (${esc(S.injury.n)}) : pas d'entraînement possible encore ${S.injury.w} semaine(s). Seuls renfo, mental et récup sont pris en compte.</div>`:''}
  ${S.ill?`<div class="alert">🤒 Malade : la semaine sera très allégée automatiquement.</div>`:''}
  <div class="row sp"><b>Volume : ${p.hours} h</b><span class="mut small">max ${maxHours()} h (${S.runner.job?'salarié':'pro'})</span></div>
  <input type="range" min="0" max="${maxHours()}" value="${p.hours}" style="width:100%" oninput="S.plan.hours=Number(this.value);render()">
  <div class="row sp" style="margin:10px 0 4px"><b>Séances clés (${nSess}/7)</b></div>
  <div class="sessgrid">${Object.entries(SESS).map(([k,s])=>`<div class="sess ${p.s[k]?'on':''}" data-tip="${esc('<b>'+s.n+'</b> — '+s.h+'<br>Travaille : '+Object.keys(s.t).map(x=>STATS[x]).join(', '))}"><div><b>${s.i} ${s.n}</b><small>${Object.keys(s.t).map(x=>STATS[x]).join(', ')}</small></div><div class="counter"><button class="sm" onclick="sess('${k}',-1)">−</button><span>${p.s[k]||0}</span><button class="sm" onclick="sess('${k}',1)">+</button></div></div>`).join('')}</div>
  <div class="grid g3" style="margin-top:12px;gap:8px">
   <button onclick="autoPlan('weak')">🎯 Travailler mes faiblesses</button>
   <button onclick="autoPlan('strong')">💪 Renforcer mes points forts</button>
   <button class="pri" onclick="applySuggested()">✨ Plan suggéré (${esc(suggestPlan().label)})</button>
  </div>
 </div></div>
 <div>
  ${tipBox(1)}
  <div class="card" style="margin-bottom:14px"><h3>Impact prévu</h3>
   <div class="grid g3">
    <div><div class="mut small">Charge</div><div class="kpi">${Math.round(load)}</div></div>
    <div><div class="mut small">Forme la semaine prochaine</div><div class="kpi ${formLabel(formOf(proj.ctl,proj.atl))[1]}">${Math.round(formOf(proj.ctl,proj.atl))}</div></div>
    <div><div class="mut small">Risques</div><div class="row"><span class="risk ${riskClass(ir)}">🩹 ${pct(ir)}</span><span class="risk ${riskClass(il)}">🤒 ${pct(il)}</span></div></div>
   </div>
  </div>
  <div class="card"><h3>Progression attendue</h3>${Object.keys(STATS).map(k=>statRow(k,gains[k])).join('')}</div>
 </div></div>`;
}
function statRow(k,g){const v=S.stats[k],p=S.pot[k];const col=v>=75?'var(--ok)':v>=50?'var(--acc2)':v>=30?'var(--acc)':'var(--bad)';
 return `<div class="stat" data-tip="${esc(STAT_HELP_LONG[k]+(potKnown()?'<br><br>Le trait blanc = ton potentiel estimé (≈'+potShown(k)+') : la progression ralentit en s\'en approchant.':''))}"><span>${STATS[k]}</span><div class="bar"><i style="width:${v}%;background:${col}"></i>${S.guided&&potKnown()?`<span class="pot" style="left:${potShown(k)}%"></span>`:''}</div><span class="small">${Math.round(v)}${g?` <span class="${g>0?'ok':'bad'}">${g>0?'+':''}${g.toFixed(2)}</span>`:''}</span></div>`;}
function potShown(k){return clamp(Math.round(S.pot[k]/5)*5,0,100);} // potentiel estimé (arrondi)
function sess(k,d){const s=S.plan.s;const tot=Object.values(s).reduce((a,b)=>a+b,0);if(d>0&&tot>=7)return;s[k]=clamp((s[k]||0)+d,0,4);if(!s[k])delete s[k];render();}
function autoPlan(mode){
 const ent=Object.entries(S.stats).filter(([k])=>k!=='rec');
 ent.sort((a,b)=>mode==='weak'?a[1]-b[1]:b[1]-a[1]);
 const targets=ent.slice(0,2).map(([k])=>k);
 const best=k=>Object.entries(SESS).filter(([,s])=>s.t[k]).sort((a,b)=>b[1].t[k]-a[1].t[k])[0][0];
 const s={long:1,renfo:1};targets.forEach(k=>{const b=best(k);s[b]=(s[b]||0)+2;});
 S.plan.s=s;render();
}

// ---------- prévision des gains (même formule que la simulation) ----------
function ageF(){const a=S.runner.age;return a<23?1.2:a<=32?1:a<=40?.85:.65;}
function gainMult(){return (1+.12*SL('coach','plan'))*(1+.04*SL('physio','renfo'))*ageF()*potOf().growth;}
function previewGains(p){
 const g={};for(const k in STATS)g[k]=0;
 if(S.injury){g.vit=-.15;g.end=-.15;return g;}
 const ill=S.ill?.3:1;
 for(const k in p.s){for(const st in SESS[k].t)g[st]+=.28*p.s[k]*SESS[k].t[st];}
 g.end+=.018*p.hours;
 const fm=formOf(S.ctl,S.atl);const m=gainMult()*(fm<25?.6:1)*ill;
 for(const k in g){g[k]=g[k]*m*Math.max(0,(S.pot[k]-S.stats[k]))/S.pot[k];}
 g.men+=.12*SL('mental')*(S.pot.men-S.stats.men)/S.pot.men;
 g.nut+=.08*SL('nutri')*(S.pot.nut-S.stats.nut)/S.pot.nut;
 g.res+=.1*SL('physio')*(S.pot.res-S.stats.res)/S.pot.res;
 if(p.hours<3)for(const k in g)g[k]-=.08;
 if(S.runner.age>36){g.vit-=.03;g.rec-=.02;}
 return g;
}

// ---------- objectif / périodisation ----------
function goalInfo(){if(!S.goal)return null;const[e,c]=S.goal.split('|');const r=S.regs.find(x=>x.e===e&&x.c===c&&!x.done);if(!r)return null;return{ev:EVMAP[e],f:getF(e,c),week:r.week,wt:r.week-S.week};}
function phaseOf(wt){
 if(wt>12)return{n:'Foncier',c:'#3b8fd4',tip:'Construis le volume progressivement : sortie longue, seuil, renfo.'};
 if(wt>6)return{n:'Développement',c:'#45c08a',tip:'Ajoute côtes et fractionné, monte le volume avec une semaine légère toutes les 4.'};
 if(wt>2)return{n:'Spécifique',c:'#e7b94a',tip:'Simule la course : sorties longues avec D+, descentes, test nutrition, sorties de nuit si besoin.'};
 if(wt>0)return{n:'Affûtage',c:'#1fa89a',tip:'Baisse le volume (−30 à −50 %), garde un peu d\'intensité : la forme remonte.'};
 return{n:'Course',c:'#ef5b5b',tip:'C\'est le jour J !'};
}
function suggestPlan(){
 const base=lvl().hours*(1+clamp((S.ctl-(lvl().hours*8+45))/300,-.2,.4));
 const sinceRace=S.week-S.lastRaceWeek;const g=goalInfo();
 const cf=g?{'20K':.85,'50K':1,'100K':1.15,'100M':1.25}[catOf(g.f)]:1;
 let h=base,s={},label='entretien';
 if(sinceRace<=1&&S.lastRaceEkm>40){h=base*.45;s={recup:2,mental:1};label='récup après course';}
 else if(!g){s={long:1,seuil:1,renfo:1};const w=Object.entries(S.stats).filter(([k])=>k!=='rec').sort((a,b)=>a[1]-b[1])[0][0];const b=Object.entries(SESS).filter(([,x])=>x.t[w]).sort((a,b)=>b[1].t[w]-a[1].t[w])[0][0];s[b]=(s[b]||0)+1;}
 else{
  const big=g.f.dp/g.f.km>40,night=hOf(defStart(g.f))>=18||hOf(defStart(g.f))<5||catOf(g.f)==='100M',tech=g.ev.tech>=4;const wt=g.wt;
  if(wt>12){h=base*cf;s={long:1,seuil:1,renfo:1};s[big?'bat':'cotes']=1;label='foncier';}
  else if(wt>6){h=base*cf*1.1;s={long:1,cotes:1,vma:1,renfo:1};if(g.f.dm/g.f.km>40)s.desc=1;label='développement';}
  else if(wt>2){h=base*cf*1.15;s={long:2,cotes:1,desc:1,nutri:1};if(night)s.nuit=1;if(tech)s.tech=1;if(S.stats.men<45)s.mental=1;label='spécifique';}
  else if(wt===2){h=base*cf*.75;s={seuil:1,renfo:1,mental:1};label='affûtage';}
  else{h=base*cf*.5;s={seuil:1,recup:1,mental:1};label='affûtage';}
  if(wt>3&&(S.week%4===3)){h*=.72;label+=' (semaine légère)';}
 }
 let tot=0;for(const k in s){tot+=s[k];}while(tot>7){const k=Object.keys(s)[0];s[k]--;if(!s[k])delete s[k];tot--;}
 return{hours:clamp(Math.round(h),2,maxHours()),s,label};
}
function applySuggested(){const p=suggestPlan();S.plan={hours:p.hours,s:p.s};render();}

function vPrep(){
 const g=goalInfo();
 const regs=S.regs.filter(r=>!r.done&&r.week>S.week);
 let html=`<div class="grid g2"><div><div class="card" style="margin-bottom:14px"><h2>Course objectif</h2>`;
 if(!regs.length)html+=`<p class="mut">Inscris-toi d'abord à une course dans le calendrier.</p>`;
 else html+=`<select style="width:100%" onchange="S.goal=this.value||null;render()"><option value="">— choisir —</option>${regs.map(r=>{const f=getF(r.e,r.c);const k=r.e+'|'+r.c;return`<option value="${k}" ${S.goal===k?'selected':''}>${esc(EVMAP[r.e].name)} — ${esc(f.name)} (${weekLabel(r.week)})</option>`;}).join('')}</select>`;
 if(g){
  const tot=Math.max(g.week,1);
  const seg=[[0,Math.max(0,g.week-12)],[Math.max(0,g.week-12),Math.max(0,g.week-6)],[Math.max(0,g.week-6),Math.max(0,g.week-2)],[Math.max(0,g.week-2),g.week]];
  const ph=['Foncier','Développement','Spécifique','Affûtage'],cols=['#3b8fd4','#45c08a','#e7b94a','#1fa89a'];
  html+=`<div style="margin:14px 0"><div class="row sp small mut"><span>Début de saison</span><span>${weekLabel(g.week)}</span></div>
   <div class="phase">${seg.map((s,i)=>s[1]>s[0]?`<div style="width:${(s[1]-s[0])/tot*100}%;background:${cols[i]}">${ph[i]}</div>`:'').join('')}</div>
   <div style="position:relative;height:14px"><div style="position:absolute;left:${clamp(S.week/tot*100,0,100)}%;font-size:11px">▲ toi</div></div></div>
   <div class="grid g3"><div><div class="mut small">Dans</div><div class="kpi">${g.wt} sem.</div></div><div><div class="mut small">Phase</div><div class="kpi" style="color:${phaseOf(g.wt).c}">${phaseOf(g.wt).n}</div></div><div><div class="mut small">Format</div><div class="kpi">${catOf(g.f)}</div></div></div>
   <p>${phaseOf(g.wt).tip}</p>
   <h3>Ce que demande cette course</h3><ul class="small">${demands(g).map(x=>`<li>${x}</li>`).join('')}</ul>`;
 }
 html+=`</div>`;
 html+=`</div><div>${tipBox(1)}`;
 if(g){
  const preps=prepRaces(g);
  html+=`<div class="card"><h3>Courses de préparation conseillées</h3><p class="small mut">Idéalement 4 à 10 semaines avant l'objectif, sur un format plus court : tester le matériel, la nutrition et l'allure sans trop se fatiguer.</p>
  ${preps.length?`<table>${preps.map(([e,f,w])=>`<tr><td>${weekLabel(w)}<br><span class="mut small">J-${g.week-w} sem.</span></td><td><b>${esc(e.name)}</b><br><span class="small mut">${esc(f.name)} · ${f.km} km · ${f.dp} D+</span></td><td>${regBtn(e,f)}</td></tr>`).join('')}</table>`:'<p class="mut">Aucune course adaptée dans la fenêtre.</p>'}</div>`;
 }
 if(g){const sp=suggestPlan();html+=`<div class="card" style="margin-top:10px"><h3>Semaine suggérée : ${esc(sp.label)}</h3><p>${sp.hours} h · ${Object.entries(sp.s).map(([k,n])=>`${SESS[k].i} ${SESS[k].n} ×${n}`).join(' · ')}</p><button class="pri" onclick="applySuggested();TAB='train';render()">Appliquer à mon entraînement</button></div>`;}
 return html+`</div></div>`;
}
function demands(g){
 const f=g.f,o=[];const dpk=f.dp/f.km,st=hOf(defStart(f));
 o.push(`${f.km} km, ${f.dp} m D+ / ${f.dm} m D− — temps estimé ≈ ${fmtT(quickEstimate(g.ev,f))}`);
 if(dpk>50)o.push('Très gros dénivelé : Montée + Endurance → côtes, rando-course avec bâtons.');
 else if(dpk<20)o.push('Parcours roulant : Vitesse → seuil et fractionné.');
 if(f.dm/f.km>45)o.push('Longues descentes : renfo excentrique + descentes rapides pour préserver les quadris.');
 if(g.ev.tech>=4)o.push('Terrain technique : séances en terrain engagé.');
 if(catOf(f)==='100M'||st>=18||st<5)o.push('Passage de nuit : sorties de nuit, et une bonne frontale.');
 if(catOf(f)!=='20K')o.push('Ravitaillement crucial : entraîne ton estomac (tests nutrition).');
 if(f.lottery)o.push('Course tirée au sort : il faut des Running Stones (ou une grosse réputation).');
 return o;
}
function prepRaces(g){
 const out=[];const gc=CATS.indexOf(catOf(g.f));
 for(const e of EVENTS){const w=evWeek(e);if(w<g.week-10||w>g.week-3||w<=S.week)continue;
  for(const f of e.formats){const c=CATS.indexOf(catOf(f));if(c<gc||(gc===0&&c===0)){out.push([e,f,w,Math.abs(f.dp/f.km-g.f.dp/g.f.km)+(e.region==='world'?30:0)]);}}}
 return out.sort((a,b)=>a[3]-b[3]).slice(0,innerHeight<960?4:6);
}

// ---------- page d'une course (résultats) ----------
let RV=null;
function openRace(eid,season){RV={e:eid,season:season||S.season,back:TAB==='race'?(RV&&RV.back)||'agenda':TAB};TAB='race';closeModal();render();}
function myResult(eid,code,season){return S.results.find(r=>r.season===season&&r.e===eid&&r.c===code);}
function resTxt(r){if(!r)return'';if(r.dns)return'🚫 DNS';if(r.dnf)return'❌ DNF';return`✅ ${fmtT(r.time)} · ${r.rank}e`;}
function vRace(){
 if(!RV)return '<p class="mut">Aucune course sélectionnée.</p>';
 const e=EVMAP[RV.e],season=RV.season;const dt=new Date(season,e.m-1,e.d);const past=season<S.season||(season===S.season&&evWeek(e)<S.week);
 const badge=`${e.tier==='major'?'<span class="badge b-major">MAJOR</span>':''}${e.tier==='final'?'<span class="badge b-final">FINALES</span>':''}${e.tier==='classic'?'<span class="badge b-major">Grande classique · hors index</span>':''}${e.tier==='local'?'<span class="badge">Course locale · hors index</span>':''}`;
 const [rf,rfh]=stabs('rf'+e.id,e.formats.map(f=>{const me=myResult(e.id,f.code,season);return[f.code,(me?'⭐ ':'')+f.name];}));
 const fmts=e.formats.filter(f=>f.code===rf).map(f=>{
  const me=myResult(e.id,f.code,season);const reg=season===S.season&&S.regs.find(x=>x.e===e.id&&x.c===f.code&&!x.done);
  const pros=PROS.map(p=>({p,r:(S.pros.res[p.id]||[]).find(y=>y.season===season&&y.e===e.id&&y.c===f.code)})).filter(x=>x.r);
  const fin=pros.filter(x=>!x.r.dnf).sort((a,b)=>a.r.time-b.r.time),dnf=pros.filter(x=>x.r.dnf);
  const ent=!past&&season===S.season?entrants(e,f):[];
  let rows=fin.map(x=>({n:`${x.p.flag} ${x.p.first} ${x.p.last}`,id:x.p.id,t:x.r.time,ix:x.r.index}));
  if(me&&!me.dnf&&!me.dns)rows.push({n:`⭐ ${S.runner.first} ${S.runner.last} (toi)`,me:1,t:me.time,ix:me.index});
  rows.sort((a,b)=>a.t-b.t);
  return `<div class="card" style="margin-bottom:10px"><div class="row sp"><div><b class="big">${esc(f.name)}</b> <span class="mut small">${f.km} km · ${f.dp} m D+ · ${f.dm} m D− · ${catOf(f)} · départ ${f.day?f.day+' ':''}${defStart(f)}</span></div><div>${past?'':regBtn(e,f)}</div></div>
   ${me?`<div class="${me.dns?'alert':me.dnf?'alert':'tip'}" style="margin-top:8px"><b>Ta course :</b> ${me.dns?'🚫 DNS — forfait':me.dnf?'❌ DNF'+(me.why?' — '+esc(me.why):''):`✅ ${fmtT(me.time)} · <b>${me.rank}e</b>/${me.fin}${me.rankCat?' · '+me.rankCat+'e '+(S.runner.sex==='F'?'femme':'homme'):''}${me.index?' · index <b>'+me.index+'</b>':''}`}</div>`:reg?'<div class="tip" style="margin-top:8px">✅ Tu es inscrit(e).</div>':''}
   ${rows.length?`<table style="margin-top:8px"><tr><th>#</th><th>Coureur</th><th>Temps</th><th>Index</th></tr>${rows.map((r,i)=>`<tr ${r.me?'style="background:var(--tint)"':`class="click" onclick="openPro('${r.id}')"`}><td>${i+1}</td><td>${r.me?'<b class="warn">'+esc(r.n)+'</b>':esc(r.n)}</td><td>${fmtT(r.t)}</td><td>${r.ix||'—'}</td></tr>`).join('')}</table><p class="small mut">Classement entre les pros (et toi) ayant pris le départ.</p>`:''}
   ${dnf.length?`<p class="small">Abandons : ${dnf.map(x=>`<span class="click" onclick="openPro('${x.p.id}')">${x.p.flag} ${esc(x.p.last)}</span>`).join(', ')}</p>`:''}
   ${ent.length?`<p class="small">⭐ Pros inscrits : ${ent.map(p=>`<span class="click" onclick="openPro('${p.id}')">${p.flag} ${esc(p.first)} ${esc(p.last)}</span>`).join(', ')}</p>`:''}
   ${past&&!rows.length&&!dnf.length&&!me?'<p class="small mut">Aucun pro au départ de ce format.</p>':''}</div>`;}).join('');
 return `<div class="row" style="margin-bottom:10px"><button class="sm" onclick="TAB=RV.back||'agenda';render()">← Retour</button></div>
 <div class="card" style="margin-bottom:12px;display:flex;align-items:center">${logo('race',e.id,e.name,80,e.tier)}<div style="flex:1"><h2 style="border:none;padding:0;margin:0 0 4px">${esc(e.name)} ${badge}</h2><div class="mut">${esc(e.place)}, ${esc(e.country)} · ${evDateLabel(e)} ${season} · technicité ${'●'.repeat(e.tech)}${'○'.repeat(5-e.tech)} · ${past?'<b>Terminée</b>':'À venir'}</div></div></div>${rfh}${fmts}`;
}

// ---------- calendrier ----------
function regFee(e,f){return Math.round(FEE[catOf(f)]*(e.tier==='final'?1.6:e.tier==='major'?1.2:e.tier==='local'?.4:e.tier==='classic'?1.3:1)+(e.tier==='local'?(e.region==='fr'?40:150):TRAVEL[e.region]));}
function regBtn(e,f){
 const w=evWeek(e);const r=S.regs.find(x=>x.e===e.id&&x.c===f.code);
 const mr=myResult(e.id,f.code,S.season);if(mr)return `<span class="small click" onclick="openRace('${e.id}',S.season)">${resTxt(mr)}</span>`;
 if(r)return r.done?'<span class="mut small">couru</span>':`<button class="sm" onclick="unreg('${e.id}','${f.code}')">Inscrit ✓ (annuler)</button>`;
 if(w===S.week&&!PROS.some(p=>(S.pros.res[p.id]||[]).some(y=>y.season===S.season&&y.e===e.id)))return '<span class="mut small">inscriptions closes</span>';
 if(w<=S.week){const win=PROS.map(p=>({p,r:(S.pros.res[p.id]||[]).find(y=>y.season===S.season&&y.e===e.id&&y.c===f.code&&!y.dnf)})).filter(x=>x.r).sort((a,b)=>a.r.time-b.r.time)[0];return `<span class="mut small click" onclick="openRace('${e.id}',S.season)">terminée${win?' · 1er pro : '+esc(win.p.last)+' '+fmtT(win.r.time):''} ›</span>`;}
 return `<button class="sm" onclick="register('${e.id}','${f.code}')">S'inscrire · ${money(regFee(e,f))}</button>`;
}
function register(eid,code){
 const e=EVMAP[eid],f=getF(eid,code),w=evWeek(e),fee=regFee(e,f);
 if(S.regs.some(r=>r.week===w&&!r.done))return toast('Tu as déjà une course cette semaine-là.');
 if(S.money<fee)return toast('Budget insuffisant.');
 const st=stonesValid();
 if((f.lottery||f.stone)&&st<1&&S.rep<70)return toast('Il faut au moins 1 Running Stone (valable 2 saisons) pour cette course.');
 if(f.lottery&&S.rep<70){
  const key=S.season+eid+code;if(S.lotteryTried[key])return toast('Tirage au sort déjà effectué cette saison.');
  S.lotteryTried[key]=1;const ch=Math.min(.85,.15+st*.07);
  if(R()>ch){log(`Tirage au sort ${f.name} : pas retenu (chance ${Math.round(ch*100)} %).`);mail('🏔️ UTMB Mont-Blanc','Résultat du tirage au sort',`Malheureusement, tu n'as pas été retenu(e) pour la <b>${f.name}</b> cette année. Continue à accumuler des Running Stones pour augmenter tes chances !`,{tab:'cal',lbl:'Choisir une autre course'});save();render();return toast(`Pas tiré au sort pour ${f.name} (chance ${Math.round(ch*100)} %).`);}
  log(`Tiré au sort pour la ${f.name} ! 🎉`,'big');mail('🏔️ UTMB Mont-Blanc','Résultat du tirage au sort',`Félicitations ${S.runner.first} ! Tu as été tiré(e) au sort pour la <b>${f.name}</b>. Ton inscription est confirmée.`,{tab:'cal',lbl:'Voir le calendrier'});

function sponsorTierAllowed(){const r=S.rep+potOf().spons+fansRep();return r>=60?3:r>=25?2:r>=3?1:0;}
function genOffer(force){

 const free=Object.keys(SPONSOR_CATS).filter(c=>!S.sponsors.some(s=>s.cat===c)&&!S.offers.some(o=>o.cat===c));if(!free.length)return;

}

const INJURIES=[['Contracture au mollet',1,2],['Entorse de cheville',2,4],['Tendinite d\'Achille',3,6],['Périostite tibiale',3,5],['Syndrome de l\'essuie-glace',2,5],['Fasciite plantaire',3,6],['Fracture de fatigue',6,10]];

function nextWeek(raceLoad){
 raceLoad=raceLoad||0;
 let plan=S.plan;const ir=injuryRisk(plan),il=illnessRisk(plan);
 let load;
 if(S.injury){plan={hours:0,s:{renfo:plan.s.renfo||0,mental:plan.s.mental||0,recup:plan.s.recup||0}};}
 else if(S.ill){plan={hours:Math.min(plan.hours,2),s:{}};}
 if(raceLoad){plan={hours:Math.round(plan.hours*.35),s:{}};}
 load=planLoad(plan)+raceLoad;
 // gains
 const g=previewGains(plan);for(const k in g)S.stats[k]=clamp(S.stats[k]+g[k],5,S.pot[k]);
 if(plan.s.nuit)S.night=Math.min(1,S.night+.08*plan.s.nuit);S.night=Math.max(0,S.night-.01);
 const p=projectLoad(load);S.ctl=p.ctl;S.atl=p.atl;S.prevHours=Math.max(plan.hours,1);
 // santé
 if(S.injury){S.injury.w--;if(S.injury.w<=0){log(`Guéri : ${S.injury.n}. Reprise progressive conseillée !`);S.injury=null;}}

// ---------- modèle de course ----------
function buildSegs(e,f){
 const rng=seeded(e.id+f.code);let pts;
 if(f.rav)pts=f.rav.map(([n,k])=>({n,k}));
 else{const n=clamp(Math.round(f.km/13),1,14);pts=[];for(let i=1;i<=n;i++)pts.push({n:i===n?'Arrivée':'Ravito '+i,k:Math.round(f.km*i/n)});}
 const segs=[];let prev=0;for(const p of pts){segs.push({n:p.n,km:p.k-prev,cum:p.k});prev=p.k;}
 const wu=segs.map(s=>s.km*(.35+rng()*1.3)),wd=segs.map(s=>s.km*(.35+rng()*1.3));
 const su=wu.reduce((a,b)=>a+b,0),sd=wd.reduce((a,b)=>a+b,0);
 segs.forEach((s,i)=>{s.dp=Math.round(f.dp*wu[i]/su/10)*10;s.dm=Math.round(f.dm*wd[i]/sd/10)*10;s.ekm=ekmOf(s.km,s.dp,s.dm);});
 const T=segs.reduce((a,s)=>a+s.ekm,0);const limit=f.limit||Math.round(T/6.2*2)/2;
 let c=0;segs.forEach(s=>{c+=s.ekm;s.cumE=c;s.cut=limit*c/T;});
 return{segs,T,limit,startH:hOf(defStart(f))};
}
const WEATHER={ideal:{n:'☀️ Conditions idéales',heat:1,mult:1},chaleur:{n:'🥵 Chaleur',heat:1.45,mult:.95},pluie:{n:'🌧️ Pluie / boue',heat:.9,mult:.95},froid:{n:'🥶 Froid / neige',heat:.75,mult:.96},orage:{n:'⛈️ Orages',heat:1.05,mult:.95}};
function rollWeather(e){const m=e.m;const t=[6,7,8,9].includes(m)?[['ideal',.42],['chaleur',.33],['orage',.25]]:[11,12,1,2].includes(m)?[['ideal',.35],['froid',.4],['pluie',.25]]:[['ideal',.5],['pluie',.3],['chaleur',.1],['froid',.1]];let r=R();for(const[k,p]of t){if((r-=p)<0)return k;}return 'ideal';}
function weatherMult(w){const W=WEATHER[w];let m=W.mult;
 if(w==='chaleur'){if(hasTal('chaleur'))m=.99;else m+=.01*perk('glasses');}
 if(['pluie','froid','orage'].includes(w)){if(hasTal('froid'))m=.99;else m+=.012*perk('textile');}
 return Math.min(1,m);}
function capacity(){return 1500+250*perk('bag');}
function giTol(){return 55+S.stats.nut*.35+(hasSpec('estomac')?12:0)+3*perk('food')+3*SL('nutri');}

// état de course pas à pas (utilisé pour les estimations ET la course interactive)
function raceInit(e,f,o){
 const C=buildSegs(e,f),st=S.stats;
 let ee=.27-st.end*.0014;if(hasTal('gestion'))ee*=.9;if(hasSpec('ultra'))ee*=.93;
 return{e,f,C,weather:o.weather,form:o.form,base:o.ratio||1,ee,i:0,t:0,cum:0,fatOff:0,store:o.form>60?500:450,dehyd:0,salt:0,gi:0,sumRE:0,sumE:0,
  moral:clamp(62+st.men*.3+4*SL('mental','conf'),0,100),dnf:null,segs:[],plan:null};
}
function fadeAt(R0,x,rAvg){const eEff=R0.ee*(rAvg>1?1+(rAvg-1)*6:1+(rAvg-1)*2);return(1.04-R0.ee)*Math.pow(Math.max(5,x)/50,-eEff);}
function legsOf(R0){const rAvg=R0.sumE?R0.sumRE/R0.sumE:R0.base;return clamp(100*fadeAt(R0,R0.cum-R0.fatOff,rAvg)/fadeAt(R0,5,1),3,100);}
function raceStep(R0,pace,n,rand){
 const s=R0.C.segs[R0.i],st=S.stats,e=R0.e,f=R0.f,ev=[];let lossMin=0;
 const wm=weatherMult(R0.weather),heat=WEATHER[R0.weather].heat,wet=R0.weather==='pluie'||R0.weather==='orage';
 const r=R0.base*pace,rAvg=(R0.sumRE+r*s.ekm)/(R0.sumE+s.ekm);
 const up=s.dp/100*1.5,dn=s.dm/100*.8,fl=Math.max(s.km-(s.dp+s.dm)/80,s.km*.2),sum=up+dn+fl;
 const mon=st.mon+(f.dp/f.km>40?2*perk('poles'):0),des=st.des+1.5*perk('shoes'),tec=st.tec+1.5*perk('shoes');
 const skill=(up*mon+dn*des+fl*st.vit)/sum;
 const techPen=1-Math.max(0,e.tech*16-tec)*.0025*(wet?1.5:1);
 const Vb=6+skill*.175;
 let fade=fadeAt(R0,R0.cum-R0.fatOff+s.ekm/2,rAvg);
 if(hasTal('finisseur')&&R0.cum/R0.C.T>.8)fade*=1.04;
 const clock=(R0.C.startH+R0.t)%24,night=clock>=21.5||clock<6;
 let nm=1;if(night){let pen=.07*(1-S.night*.5);if(hasSpec('nocturne'))pen=.01;pen*=(1-.18*perk('lamp'));nm=1-pen;}
 let nutM=1;
 if(n){if(R0.store<150)nutM*=.75+Math.max(R0.store,0)/600;if(R0.dehyd>2500)nutM*=.86;else if(R0.dehyd>1200)nutM*=.94;}
 const formM=.92+R0.form*.0012;
 let dt=s.ekm/(Vb*techPen*fade*r*formM*wm*nm*nutM);
 if(n){
  const gel=+n.gel||0,iso=+n.iso||0,sol=+n.sol||0,eau=+n.eau||0,sel=+n.sel||0;
  const carbs=gel*25+iso*30+sol*35;let water=eau+iso*500;if(water>capacity()){water=capacity();ev.push('🎒 Trop d\'eau prévue pour ton sac : tu n\'as pas pu tout emporter');}
  R0.store+=carbs*(R0.gi?.5:1)-70*dt;R0.gi=0;
  R0.dehyd=Math.max(-2500,R0.dehyd+550*heat*dt-water);
  R0.salt=Math.max(-3,R0.salt+(heat>1.2?.9:.45)*dt-sel);
  if(rand){
   const cph=carbs/dt,tol=giTol();
   if(cph>tol&&R()<Math.min(.8,(cph-tol)/40)){const l=rint(10,35);lossMin+=l;R0.gi=1;ev.push(`🤢 Troubles digestifs (${Math.round(cph)} g/h, trop pour ton estomac) : −${l} min`);}
   if(R0.store<0){const l=rint(20,50);lossMin+=l;R0.store=60;ev.push(`🥴 Fringale / hypoglycémie : −${l} min`);}
   if((R0.salt>3&&heat>1.1&&R()<.4)||(R0.dehyd>2500&&R()<.3)){const l=rint(10,25);lossMin+=l;ev.push(`⚡ Crampes : −${l} min`);}
   if(R0.dehyd<-1500&&sel<dt*.3&&R()<.25){const l=rint(30,60);lossMin+=l;ev.push(`💧 Trop bu sans sel (hyponatrémie) : −${l} min`);if(R()<.3)R0.dnf='Hyponatrémie — évacué par l\'organisation';}
  }
 }
 if(rand){
  const pc=dt*.02*(1+Math.max(0,e.tech*16-st.tec)/30)*(1-st.des/250)*(wet?1.6:1)*(1-.15*perk('shoes'))*(hasSpec('descendeur')?.6:1)*(pace>1.04?1.4:1);
  if(R()<pc){if(R()<.08){R0.dnf=R0.dnf||'Chute sévère — abandon';ev.push('💥 Grosse chute !');}else{const l=rint(5,20);lossMin+=l;ev.push(`💥 Chute : −${l} min`);}}
  const pm=dt*.035*(1-st.men/130)*(1-.2*SL('mental','crise'))*(night?1.5:1)*(hasSpec('mental')?.6:1)*(1.6-R0.moral/100);
  if(R()<pm){const l=rint(10,30);lossMin+=l;ev.push(`😮‍💨 Coup de mou : −${l} min`);}
  if(R()<dt*.012*(wet?2:1)){const l=rint(5,15);lossMin+=l;ev.push(`🦶 Ampoules : −${l} min`);}
 }
 dt+=lossMin/60;R0.t+=dt;R0.cum+=s.ekm;R0.sumRE+=r*s.ekm;R0.sumE+=s.ekm;
 let dmo=-dt*2.2*(night?1.5:1)-ev.length*7;if(R0.store<100)dmo-=5;if(R0.dehyd>1500)dmo-=4;
 if(R0.plan){const d=(R0.t-R0.plan[R0.i])*60;if(d>10)dmo-=4;else if(d<-5)dmo+=3;}
 if(hasSpec('mental'))dmo*=.6;R0.moral=clamp(R0.moral+dmo,0,100);
 if(rand&&!R0.dnf&&R0.t>s.cut)R0.dnf=`Hors barrière horaire à ${s.n}`;
 if(rand&&!R0.dnf&&R0.moral<=0)R0.dnf=`Abandon à ${s.n} : plus une once de moral`;
 R0.segs.push({...s,t:dt,at:R0.t,ev,store:R0.store,dehyd:R0.dehyd,night,pace,moral:R0.moral});
 R0.i++;
}
const STOPS={
 express:{n:'⚡ Express',d:'1 min — on remplit et on repart',min:1,m:0,c:0,w:0,rec:0},
 normal:{n:'🍲 Normal',d:'4 min — soupe, coca, on souffle',min:4,m:5,c:30,w:250,rec:0},

};
function ravitoStop(R0,k){const K=STOPS[k];R0.t+=K.min*(1-.1*SL('crew','rapid'))/60;R0.moral=clamp(R0.moral+K.m+2*SL('mental','motiv')+3*SL('crew','soutien'),0,100);R0.store+=K.c;R0.dehyd=Math.max(-2500,R0.dehyd-K.w);R0.fatOff+=K.rec*(R0.cum-R0.fatOff);

function model(e,f,o){

 while(st.i<n&&!st.dnf){if(st.i>0&&o.stopMin)st.t+=o.stopMin/60;raceStep(st,1,o.nut?o.nut[st.i]:null,!!o.rand);}

// ---------- suggestions nutrition ----------
// mode 'base' = repères généraux ; 'staff' = nutritionniste (adapté à ta tolérance, à la météo et à ton état)
function suggestNut(t,mode,weather,R0){
 const heat=WEATHER[weather].heat,cap=capacity();
 let gph,mlph,selph;
 if(mode==='staff'){gph=Math.min(giTol()-5,60+SL('nutri')*7);mlph=530*heat;selph=heat>1.2?.9:.5;}
 else{gph=t<1.5?30:50;mlph=t<1.2?250:450;selph=.4;}
 let carbs=gph*t,water=mlph*t;
 if(R0&&mode==='staff'){carbs+=Math.max(0,250-R0.store)*.5;water+=Math.max(0,R0.dehyd)*.6;}
 const iso=t>1?Math.min(2,Math.floor(t/1.2)):0,sol=t>2.5?Math.min(3,Math.floor(t/2.5)):0;
 const gel=Math.max(0,Math.round((carbs-iso*30-sol*35)/25));
 const eau=Math.round(clamp(water-iso*500,0,cap-iso*500)/50)*50;
 return{gel,iso,sol,eau,sel:Math.round(selph*t)};
}

let RP=null;
function openPlan(){
 const race=raceThisWeek();if(!race)return;
 const key=S.season+'|'+race.ev.id+'|'+race.f.code;
 if(!S.forecast[key])S.forecast[key]=rollWeather(race.ev);
 const w=S.forecast[key];const fm=formOf(S.ctl,S.atl);

function profileSVG(segs,W,H){

 pts.forEach(p=>{min=Math.min(min,p[1]);max=Math.max(max,p[1]);});
 const X=x=>x/totKm*(W-10)+5,Y=y=>H-14-(y-min)/(max-min||1)*(H-30);

 return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="background:#0f161b;border-radius:10px"><path d="${path} L${X(totKm)},${H-14} L5,${H-14} Z" fill="#1fa89a22"/><path d="${path}" fill="none" stroke="#1fa89a" stroke-width="2"/>${segs.map(s=>`<line x1="${X(s.cum)}" x2="${X(s.cum)}" y1="10" y2="${H-14}" stroke="#ffffff18"/><text x="${X(s.cum)}" y="${H-3}" fill="#8fa1ad" font-size="9" text-anchor="end">${s.cum}</text>`).join('')}</svg>`;

function rankRace(e,f,time){
 const C=buildSegs(e,f);const T=C.T;const fT=Math.pow(Math.max(T,5)/50,-.2);
 const V=T/(time*fT);const rng=seeded(S.season+e.id+f.code);
 const depth=e.tier==='final'?1:e.tier==='major'||e.tier==='classic'?.97:e.tier==='local'?.8:.92;
 const N=f.field||(e.tier==='local'?350:{'20K':600,'50K':900,'100K':900,'100M':1200}[catOf(f)]);const Nm=Math.round(N*.78),Nw=N-Nm;
 const riv=[];const pool=(arr,top,n,sex)=>{const names=[...arr].sort(()=>rng()-.5);for(let i=0;i<n;i++){const v=top*depth*(1-i*.012)*(1+(rng()*2-1)*.03);riv.push({n:names[i],sex,V:v,time:T/(v*fT)});}};
 const ent=entrants(e,f).map(p=>({p,r:proRace(p,e,f)})).filter(x=>!x.r.dnf);
 ent.forEach(x=>riv.push({n:`${x.p.flag} ${x.p.first} ${x.p.last}`,sex:x.p.sex,V:x.r.time?T/(x.r.time*fT):0,time:x.r.time,pro:1}));

 const minM=Math.min(99,...riv.filter(r=>r.sex==='H').map(r=>r.V)),minW=Math.min(99,...riv.filter(r=>r.sex==='F').map(r=>r.V));
 const q=(Vmed,cnt,minR)=>V>=minR?0:cnt*(Phi(Math.log(minR/Vmed)/.22)-Phi(Math.log(V/Vmed)/.22));
 const fasterR=riv.filter(r=>r.V>V);

 if(sex==='H')rankCat=Math.min(Math.round(fin*.8),1+fasterR.filter(r=>r.sex==='H').length+Math.round(qm));

 return{rank,rankCat,fin,podium,V};
}

  html=`<div class="card"><div class="grid g3"><div><div class="mut small">Temps final</div><div class="kpi">${fmtT(res.total)}</div><div class="small mut">objectif ${fmtT(RP.target)}</div></div>
   <div><div class="mut small">Classement scratch</div><div class="kpi">${r.rank}<span class="small mut"> / ${r.fin}</span></div>${r.rankCat?`<div class="small">${S.runner.sex==='F'?'Femmes':'Hommes'} : <b>${r.rankCat}</b></div>`:''}</div>
   <div><div class="mut small">Gains</div><div class="small">${ix?`📈 Index de course : <b>${ix}</b> (${cat})<br>🪨 +${st} Running Stones<br>`:`<span class="mut">${e.tier==='classic'?'Grande classique hors circuit':'Course locale'} : pas d\'index ni de Running Stones</span><br>`}⭐ +${repG.toFixed(1)} réputation<br>💶 ${money(prize+bon)}${bon?' (dont primes sponsors '+money(bon)+')':''}</div></div></div>
   <h3 style="margin-top:10px">Top 5</h3><table>${r.podium.map((p,i)=>`<tr><td>${i+1}</td><td>${p.me?'<b class="warn">'+esc(p.n)+' (toi)</b>':p.pro?'<b>'+esc(p.n)+'</b>':esc(p.n)}</td><td>${fmtT(p.time)}</td></tr>`).join('')}</table>
   <p class="small">${diag(res,ratio)}</p></div>`;
  log(`🏁 ${f.name} : ${fmtT(res.total)}, ${r.rank}e/${r.fin}${r.rankCat?` (${r.rankCat}e ${S.runner.sex==='F'?'femme':'homme'})`:''}.${ix?' Index '+ix+', +'+st+' stones.':''}`,'big');
 }
 S.results.push(result);
 const pInj=(.02+res.C.T/100*.03)*(1-S.stats.res/200)*(1-.15*SL('kine','soins'))*(hasTal('solide')?.6:1)*(ratio>1.04?1.3:1);
 if(R()<pInj){const x=pick(INJURIES.slice(0,5));const w=Math.max(1,Math.round(rint(x[1],x[2])*(1-.15*SL('kine','soins'))));S.injury={n:x[0],w};dropRegs();html+=`<div class="alert">🩹 Après la course : ${esc(x[0])} (${w} sem.)</div>`;log(`Blessure après la course : ${x[0]}.`);}
 const rec=Math.max(1,Math.round(res.C.T/(hasTal('recup')?35:25)));
 html+=`<p class="small mut">💡 Conseil récup : environ ${rec} semaine(s) facile(s) avant de reprendre l'intensité.</p><div class="row" style="justify-content:flex-end"><button class="pri" onclick="closeModal();RP=null;RACE=null;nextWeek(${Math.round(res.C.T*1.6)})">Continuer ▶</button></div>`;
 box.innerHTML=html;save();
}
function diag(res,ratio){
 const o=[];if(ratio>1.04)o.push('Tu as couru au-dessus de tes capacités réelles : la fin a coûté très cher.');else if(ratio<.96)o.push('Course prudente : tu avais de la marge.');
 const last=res.segs[res.segs.length-1];
 if(last&&last.store<100)o.push('Tes réserves d\'énergie étaient au plus bas : mange davantage (glucides/h).');
 if(last&&last.dehyd>1500)o.push('Tu as fini déshydraté : prévois plus d\'eau.');
 if(res.segs.some(s=>s.ev.some(x=>x.includes('digestif'))))o.push('Trop de glucides pour ton estomac : entraîne-le avec des tests nutrition ou réduis la dose.');
 if(!o.length)o.push('Course bien gérée !');return '🔎 Analyse : '+o.join(' ');
}

// ---------- menu / sauvegarde ----------
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#2d1f1f;border:1px solid #5a2d2d;padding:10px 16px;border-radius:10px;z-index:50';document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
function showMenu(){
 const m=document.getElementById('modal');m.className='modal';
 m.innerHTML=`<div class="mbox" style="max-width:620px"><div class="row sp"><h2>Menu</h2><button onclick="closeModal()">✕</button></div>
 <label class="row"><input type="checkbox" ${S.guided?'checked':''} onchange="S.guided=this.checked;save();render()"> Mode guidé (conseils pour débuter)</label>
 <div class="row" style="margin:12px 0"><button onclick="closeModal();SCREEN='title';render()">🏠 Écran d'accueil</button><button onclick="showHelp()">❓ Comment jouer</button><button onclick="exportSave()">📤 Exporter ma sauvegarde</button><button onclick="importBox()">📥 Importer</button><button onclick="if(document.getElementById('confirmNew').checked){const id=S.id;DEL_CONFIRM=id;closeModal();SCREEN='title';deleteCareer(id);}">🗑 Supprimer cette carrière</button><label class="small"><input type="checkbox" id="confirmNew"> confirmer</label></div>
 <div id="saveBox"></div><p class="small mut">La partie est sauvegardée automatiquement dans ce navigateur. Exporte-la pour la garder ailleurs.</p></div>`;
}
function exportSave(){const t=btoa(unescape(encodeURIComponent(JSON.stringify(S))));document.getElementById('saveBox').innerHTML=`<textarea style="width:100%;height:120px" readonly>${t}</textarea><button class="sm" onclick="navigator.clipboard.writeText(this.previousElementSibling.value).then(()=>toast('Copié !')).catch(()=>toast('Sélectionne et copie le texte'))">Copier</button>`;}
function importBox(){document.getElementById('saveBox').innerHTML=`<textarea id="impT" style="width:100%;height:120px" placeholder="Colle ta sauvegarde ici"></textarea><button class="sm pri" onclick="doImport()">Charger</button>`;}
function doImport(){try{if(S)save();S=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('impT').value.trim()))));S.id=newId();migrate();save();closeModal();render();}catch(e){toast('Sauvegarde invalide.');}}
function showHelp(){
 const m=document.getElementById('modal');m.className='modal';
 m.innerHTML=`<div class="mbox" style="max-width:720px"><div class="row sp"><h2>Comment jouer</h2><button onclick="closeModal()">✕</button></div>
 <ol>
  <li><b>Chaque tour = 1 semaine.</b> Règle ton entraînement (volume + séances clés) puis clique « Semaine suivante ».</li>
  <li><b>Forme vs fatigue</b> : la charge chronique (condition) monte lentement, la fatigue vite. Allège avant une course pour arriver frais (affûtage).</li>
  <li><b>Risques</b> : monter la charge trop vite, trop de descentes/fractionné = blessure. Fin d'automne/hiver et fatigue = maladie.</li>
  <li><b>Calendrier</b> : inscris-toi aux courses UTMB World Series. Les finir rapporte des <b>Running Stones</b>, nécessaires au tirage de l'UTMB/CCC/OCC.</li>
  <li><b>Objectif & prépa</b> : choisis ta course principale, le jeu te propose une périodisation et des courses de préparation.</li>
  <li><b>Jour de course</b> : fixe ton objectif de temps (heures de passage à chaque ravito) et ton plan nutrition. Ensuite la course se déroule.</li>
  <li><b>Sponsors & staff</b> : la réputation attire les marques ; le staff coûte cher mais change tout.</li>
 </ol><p class="small mut">Le mode guidé (menu) affiche des conseils partout. Bonne course !</p></div>`;
}

// ---------- fiche d'un pro ----------
const SPEC_HELP={ultra:'<b>Ultra</b> — Spécialiste du 100 miles : il ralentit très peu sur la durée, un peu moins rapide sur les formats courts.',long:'<b>Long</b> — Au top sur 100K, très solide sur 50K et 100M.',court:'<b>Court</b> — Explosif sur 20K-50K, moins à l\'aise au-delà de 100 km.',poly:'<b>Polyvalent</b> — Performant sur tous les formats.'};
function proStats(p){
 const rng=seeded('stats'+p.id);const base=85+(p.idx-(p.sex==='F'?800:900))/5;
 const adj={ultra:{end:8,nut:5,vit:-6,rec:3},long:{mon:5,end:3},court:{vit:8,des:4,end:-6,tec:2},poly:{tec:4,des:2}}[p.spec];
 const o={};for(const k in STATS)o[k]=Math.round(clamp(base+(adj[k]||0)+(rng()*8-4)-(k==='rec'&&proAge(p)>36?(proAge(p)-36):0),40,99));return o;
}
function openPro(id){
 const p=PROMAP[id];if(!p)return;const st=proStats(p);const res=(S.pros.res[id]||[]).slice().reverse();const sch=S.pros.sched[id]||[];
 const bars=Object.keys(STATS).map(k=>{const v=st[k];const col=v>=85?'var(--ok)':v>=70?'var(--acc2)':'var(--acc)';return`<div class="stat" data-tip="${esc(STAT_HELP_LONG[k])}"><span>${STATS[k]}</span><div class="bar"><i style="width:${v}%;background:${col}"></i></div><span class="small">${v}</span></div>`;}).join('');
 const m=document.getElementById('modal');m.className='modal';
 m.innerHTML=`<div class="mbox" style="max-width:860px"><div class="row sp"><div><h2>${p.flag} ${esc(p.first)} ${esc(p.last)}</h2>
  <div class="mut">${esc(p.nat)} · ${proAge(p)} ans (né${p.sex==='F'?'e':''} en ${p.born}) · origine : ${esc(p.home)} · <span data-tip="${esc(SPEC_HELP[p.spec])}">profil ${SPEC_LBL[p.spec]}</span></div></div><button onclick="closeModal()">✕</button></div>
  <div class="grid g2" style="margin-top:12px"><div><div class="card"><h3>Caractéristiques</h3>${bars}<p class="small mut">Estimées à partir de son niveau et de son profil.</p></div>
  <div class="card" style="margin-top:14px"><h3>🏆 Palmarès</h3>${(PALMARES[id]||[]).length?`<div class="small mut">Carrière réelle (principaux titres)</div><ul class="small">${PALMARES[id].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="small mut">Palmarès réel non renseigné.</p>'}
   ${(()=>{const g=(S.pros.res[id]||[]).filter(r=>r.place&&r.place<=3&&EVMAP[r.e].tier!=='local').slice().reverse();return g.length?`<div class="small mut" style="margin-top:6px">Dans ta partie</div><ul class="small">${g.map(r=>`<li>${r.place===1?'🥇':r.place===2?'🥈':'🥉'} ${r.season} — ${esc(EVMAP[r.e].name.replace(/ by UTMB|HOKA /g,''))} (${esc(getF(r.e,r.c).name)})</li>`).join('')}</ul>`:'';})()}</div>
  <div class="card" style="margin-top:14px"><h3>🤝 Sponsors</h3><table>${Object.entries(proSpons(p)).map(([c,b])=>`<tr><td>${SPONSOR_CATS[c].i} ${SPONSOR_CATS[c].n}</td><td style="display:flex;align-items:center">${logo('brand',b,b,30)}<b class="click" onclick="openBrand('${b.replace(/'/g,"\\'")}')">${esc(b)}</b>${PRO_SPONS_REAL[id]&&PRO_SPONS_REAL[id][c]?'':' <span class="small mut">*</span>'}</td></tr>`).join('')}</table><p class="small mut">* attribué par le jeu</p></div></div>
  <div class="card"><h3>UTMB Index</h3><div class="grid" style="grid-template-columns:repeat(5,1fr);gap:8px">${['gen',...CATS].map(c=>`<div data-tip="${esc(c==='gen'?'<b>Index général</b> — Son meilleur index de catégorie.':'<b>Index '+c+'</b> — Moyenne de ses 3 meilleures perfs '+c+' sur le circuit UTMB (2 dernières saisons). Sans résultat récent, on part de son niveau de référence.')}"><div class="mut small">${c==='gen'?'Général':c}</div><div class="kpi">${c==='gen'?proGen(p):proIdx(p,c)}</div></div>`).join('')}</div>
   <h3 style="margin-top:10px">Programme ${S.season}</h3><table>${sch.map(x=>{const e=EVMAP[x.e],f=getF(x.e,x.c);const r=(S.pros.res[id]||[]).find(y=>y.season===S.season&&y.e===x.e&&y.c===x.c);return`<tr><td class="small">${weekLabel(x.w)}</td><td>${esc(e.name.replace(/ by UTMB|HOKA /g,''))}<br><span class="small mut">${esc(f.name)} · ${f.km} km${isUTMB(e)?'':' · locale'}</span></td><td class="small">${r?(r.dnf?'<span class="bad">DNF</span>':fmtT(r.time)+(r.index?' · <b>'+r.index+'</b>':'')):(x.w<S.week?'—':'<span class="mut">à venir</span>')}</td></tr>`;}).join('')}</table>
   ${res.filter(r=>r.season<S.season).length?`<h3 style="margin-top:10px">Saisons passées</h3><table>${res.filter(r=>r.season<S.season).slice(0,8).map(r=>`<tr><td>${r.season}</td><td class="small">${esc(EVMAP[r.e].name)} — ${esc(getF(r.e,r.c).name)}</td><td class="small">${r.dnf?'DNF':fmtT(r.time)}${r.index?' · '+r.index:''}</td></tr>`).join('')}</table>`:''}
  </div></div></div>`;
}
// ---------- info-bulles (1 s de survol) ----------
(function(){let timer=null,box=null,cur=null,mx=0,my=0;
 function hide(){clearTimeout(timer);timer=null;if(box){box.remove();box=null;}}
 function show(t){if(!document.body.contains(t))return;box=document.createElement('div');box.className='tipbox';box.innerHTML=t.dataset.tip;document.body.appendChild(box);
  const w=box.offsetWidth,h=box.offsetHeight;let x=mx+14,y=my+18;if(x+w>innerWidth-8)x=mx-w-14;if(y+h>innerHeight-8)y=my-h-18;box.style.left=Math.max(8,x)+'px';box.style.top=Math.max(8,y)+'px';}
 document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
 document.addEventListener('mouseover',e=>{const t=e.target.closest?e.target.closest('[data-tip]'):null;if(t===cur)return;hide();cur=t;if(t&&t.dataset.tip)timer=setTimeout(()=>show(t),500);});
 document.addEventListener('mousedown',hide);document.addEventListener('scroll',()=>{if(box){hide();cur=null;}},true);
 // mobile : appui long
 let lp=null;document.addEventListener('touchstart',e=>{const t=e.target.closest?e.target.closest('[data-tip]'):null;hide();if(!t)return;const tc=e.touches[0];mx=tc.clientX;my=tc.clientY;lp=setTimeout(()=>show(t),600);},{passive:true});
 document.addEventListener('touchend',()=>{clearTimeout(lp);setTimeout(hide,2500);},{passive:true});
 window.hideTip=()=>{hide();cur=null;};
})();

 d.innerHTML=`<span>🎉 <b>Nouvelle version disponible</b>${j.note?' — '+esc(j.note):''}</span><button class="pri sm" onclick="try{save()}catch(e){};location.reload()">Mettre à jour</button><button class="sm" onclick="this.parentNode.remove()">Plus tard</button>`;
 d.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;background:var(--bg2);border:1px solid var(--acc);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px #000a';document.body.appendChild(d);}

load();render();
